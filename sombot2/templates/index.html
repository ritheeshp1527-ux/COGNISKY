<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>COGNISKY - Chat Companion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #FFF7ED;
      color: #2F3E46;
      font-family: sans-serif;
      margin: 0;
      overflow: hidden;
    }

    .fade-in {
      animation: fadeIn 0.8s ease-out forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    button {
      transition: all 0.3s ease-in-out;
    }

    .soft-box {
      background: #FDEDDC;
      border: 1px solid rgba(47, 62, 70, 0.05);
      border-radius: 2rem;
      box-shadow: 0 10px 40px rgba(47, 62, 70, 0.04);
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(47, 62, 70, 0.1);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(47, 62, 70, 0.2);
    }

    .btn-action {
      background: white;
      color: #84A98C;
      border: 1px solid rgba(132, 169, 140, 0.3);
      padding: 0.6rem 1.2rem;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.875rem;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02);
    }

    .btn-action:hover {
      background: #fdfdfd;
      border-color: #84A98C;
    }
  </style>
</head>

<body class="flex justify-center items-center h-screen">

  <div
    class="w-[90%] md:w-[75%] max-w-5xl flex flex-col h-[92vh] soft-box overflow-hidden z-10 relative animate-[fadeInUp_0.8s_ease-out]">

    <header class="bg-[#FFF7ED] px-8 py-5 flex items-center justify-between border-b border-[#2F3E46]/5 shadow-sm">
      <h1 class="text-2xl font-bold text-[#84A98C] tracking-wide">
        COGNISKY Safe Space
      </h1>
      <div class="flex space-x-3">
        <button id="analyseBtn" class="btn-action">
          Reflect on Dialogue
        </button>
        <button id="resetBtn"
          class="bg-white text-[#E5989B] border border-[#E5989B]/30 px-5 py-2 rounded-xl font-bold text-sm shadow-sm hover:border-[#E5989B] transition">
          Start Fresh
        </button>
        <a href="/dashboard"
          class="bg-[#84A98C] text-white px-5 py-2 rounded-xl font-bold text-sm shadow-sm hover:bg-[#6b8e73] transition flex items-center">
          Exit Room
        </a>
      </div>
    </header>

    <main id="chat-box" class="flex-1 overflow-y-auto px-8 py-8 space-y-6"></main>

    <div
      class="bg-[#FFF7ED] p-5 border-t border-[#2F3E46]/5 flex items-center space-x-4 shadow-[0_-4px_15px_rgba(0,0,0,0.02)]">
      <input id="user-input" type="text" placeholder="Share what's on your mind..." autocomplete="off"
        class="flex-1 px-6 py-4 bg-white border border-[#2F3E46]/10 rounded-2xl focus:outline-none focus:border-[#84A98C] text-[#2F3E46] placeholder-[#2F3E46]/40 font-medium shadow-sm transition" />

      <button id="sendBtn"
        class="p-4 bg-[#84A98C] text-white rounded-2xl shadow-sm hover:bg-[#6b8e73] hover:-translate-y-1 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 transform rotate-90" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
        </svg>
      </button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById("chat-box");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("sendBtn");
    const analyseBtn = document.getElementById("analyseBtn");
    const resetBtn = document.getElementById("resetBtn");

    function appendMessage(text, from) {
      const wrapper = document.createElement("div");
      wrapper.className = "flex w-full " + (from === "user" ? "justify-end" : "justify-start") + " fade-in";

      const content = document.createElement("div");
      content.className = "max-w-[75%] space-y-1";

      const label = document.createElement("div");
      label.className = "text-xs font-bold uppercase " +
        (from === "user" ? "text-[#84A98C] text-right pr-2" : from === "bot" ? "text-[#F4A261] pl-2" : "text-[#E5989B] pl-2");
      label.innerText = from === "user" ? "You" : from === "bot" ? "Companion" : "Analysis";

      const bubble = document.createElement("div");
      bubble.className = (from === "user"
        ? "bg-[#84A98C] text-white"
        : from === "bot"
          ? "bg-white text-[#2F3E46] border border-[#2F3E46]/5"
          : "bg-white border-l-4 border-[#F4A261] text-[#2F3E46]") +
        " px-6 py-4 rounded-3xl shadow-sm whitespace-pre-wrap font-medium leading-relaxed text-sm lg:text-base";

      if (from === "user") bubble.classList.add("rounded-br-sm");
      else bubble.classList.add("rounded-bl-sm");

      bubble.innerText = text;

      content.appendChild(label);
      content.appendChild(bubble);
      wrapper.appendChild(content);
      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
      const msg = userInput.value.trim();
      if (!msg) return;
      appendMessage(msg, "user");
      userInput.value = "";

      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: msg }),
      });
      const data = await res.json();
      appendMessage(data.reply, "bot");
    }

    sendBtn.onclick = sendMessage;
    userInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });

    function appendAnalysisCard(analysisObj) {
      const wrapper = document.createElement("div");
      wrapper.className = "flex w-full justify-start fade-in mt-4";

      let limeHtml = "";
      if (analysisObj.lime_error) {
        limeHtml = `<p class="text-xs text-[#E5989B] italic mt-3">${analysisObj.lime_error}</p>`;
      } else if (analysisObj.lime_words && analysisObj.lime_words.length > 0) {
        let pills = analysisObj.lime_words.map(w => {
          let isPositive = w.weight > 0;
          let colorClass = isPositive ? "bg-[#84A98C]/10 text-[#84A98C] border-[#84A98C]/30" : "bg-[#E5989B]/10 text-[#E5989B] border-[#E5989B]/30";
          return `<span class="inline-block px-3 py-1 text-xs font-bold border rounded-full m-1 ${colorClass}">${w.word} (${(isPositive ? '+' : '')}${w.weight.toFixed(2)})</span>`;
        }).join('');
        limeHtml = `<div class="mt-5 pt-5 border-t border-[#2F3E46]/5"><p class="font-bold text-[#2F3E46]/50 text-xs uppercase mb-3">Linguistic Roots:</p><div class="flex flex-wrap">${pills}</div></div>`;
      }

      const card = document.createElement("div");
      card.className = "bg-white border border-[#2F3E46]/5 w-full max-w-xl p-8 rounded-[2rem] rounded-bl-sm shadow-sm space-y-6";
      card.innerHTML = `
        <div>
          <h4 class="text-3xl font-bold text-[#F4A261] capitalize leading-none mb-1">${analysisObj.mood}</h4>
          <p class="text-xs font-bold text-[#2F3E46]/50 uppercase tracking-widest">Detected Emotional State</p>
        </div>
        
        <div class="bg-[#FFF7ED] p-4 rounded-xl border border-[#2F3E46]/5">
          <div class="flex justify-between text-xs font-bold text-[#2F3E46]/60 uppercase tracking-widest mb-3">
            <span>Intensity</span>
            <span class="text-[#84A98C]">${analysisObj.severity} / 10</span>
          </div>
          <div class="w-full bg-white rounded-full h-2 overflow-hidden shadow-inner">
            <div class="bg-[#84A98C] h-2 rounded-full transition-all" style="width: ${analysisObj.severity * 10}%"></div>
          </div>
        </div>

        <div class="bg-[#84A98C]/10 text-[#2F3E46] p-5 rounded-xl border border-[#84A98C]/20">
          <p class="font-bold text-sm uppercase tracking-widest text-[#84A98C] mb-2">Gentle Suggestion</p>
          <p class="font-medium leading-relaxed">${analysisObj.suggestion}</p>
        </div>

        <div class="text-sm">
          <p class="font-bold text-xs uppercase tracking-widest text-[#2F3E46]/50 mb-2">Reflection</p>
          <p class="text-[#2F3E46]/80 leading-relaxed font-medium">${analysisObj.why}</p>
        </div>
        
        ${limeHtml}
      `;

      const content = document.createElement("div");
      content.className = "max-w-[85%] space-y-1";

      const label = document.createElement("div");
      label.className = "text-xs font-bold uppercase text-[#E5989B] pl-2";
      label.innerText = "System Insight";

      content.appendChild(label);
      content.appendChild(card);
      wrapper.appendChild(content);

      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showLoading() {
      const wrapper = document.createElement("div");
      wrapper.id = "loading-indicator";
      wrapper.className = "flex w-full justify-start fade-in";
      wrapper.innerHTML = `
        <div class="max-w-[75%] space-y-1">
          <div class="text-xs font-bold uppercase text-[#84A98C] pl-2">System</div>
          <div class="bg-white border border-[#2F3E46]/5 text-[#2F3E46]/70 px-6 py-4 rounded-3xl rounded-bl-sm shadow-sm flex items-center space-x-3">
            <svg class="animate-spin h-5 w-5 text-[#84A98C]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="font-bold text-sm">Reflecting on dialogue...</span>
          </div>
        </div>
      `;
      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function removeLoading() {
      const loading = document.getElementById("loading-indicator");
      if (loading) loading.remove();
    }

    analyseBtn.onclick = async () => {
      analyseBtn.disabled = true;
      analyseBtn.classList.add("opacity-50", "cursor-not-allowed");
      showLoading();

      try {
        const res = await fetch("/analyse", { method: "POST" });
        const data = await res.json();
        removeLoading();

        if (typeof data.analysis === 'string') {
          appendMessage(data.analysis, "bot");
        } else {
          appendAnalysisCard(data.analysis);
        }
      } catch (err) {
        removeLoading();
        appendMessage("Reflection process was interrupted.", "bot");
      } finally {
        analyseBtn.disabled = false;
        analyseBtn.classList.remove("opacity-50", "cursor-not-allowed");
      }
    };

    resetBtn.onclick = async () => {
      await fetch("/reset", { method: "POST" });
      window.location.reload();
    };

    userInput.focus();
  </script>

  <style>
    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</body>

</html>
