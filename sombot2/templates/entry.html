<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>COGNISKY - Welcome</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #FFF7ED;
      color: #2F3E46;
      font-family: sans-serif;
      margin: 0;
      overflow: hidden;
      height: 100vh;
    }

    .soft-card {
      background: #FDEDDC;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(47, 62, 70, 0.05);
      padding: 4rem 3rem;
      max-width: 650px;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .btn-primary {
      background-color: #84A98C;
      color: white;
      font-size: 1.125rem;
      font-weight: 600;
      padding: 0.875rem 3.5rem;
      border-radius: 20px;
      transition: background-color 0.3s ease;
      display: inline-block;
      cursor: pointer;
      border: none;
    }

    .btn-primary:hover {
      background-color: #63856a;
    }

    .typing-text {
      display: inline-block;
      border-right: 2px solid #84A98C;
      white-space: nowrap;
      overflow: hidden;
      animation: typing 3s steps(40, end), blink 0.75s step-end infinite;
    }

    @keyframes typing {
      0% {
        width: 0;
      }

      100% {
        width: 100%;
      }
    }

    @keyframes blink {
      50% {
        border-color: transparent;
      }
    }
  </style>
</head>

<body class="flex justify-center items-center">

  <div class="soft-card animate-[fadeInUp_0.8s_ease-out]">

    <h1 class="text-5xl font-bold text-[#84A98C] mb-4 tracking-wide pb-2">
      COGNISKY
    </h1>
    <h6 class="text-lg font-semibold text-[#F4A261] mb-6 tracking-widest uppercase">State Of Mind System</h6>

    <p class="text-xl text-[#2F3E46] mb-8 typing-text h-8 font-medium">A calm companion for meaningful reflection.</p>

    <p class="text-[#2F3E46] opacity-80 mb-10 leading-relaxed font-medium">
      COGNISKY offers a warm, safe space to analyze your thoughts, understand your emotions, and find quiet guidance.
    </p>

    <button id="enterBtn" class="btn-primary tracking-wide">Enter Space</button>
  </div>

  <script>
    document.getElementById("enterBtn").addEventListener("click", () => {
      window.location.href = "/login";
    });

    const style = document.createElement('style');
    style.innerHTML = `@keyframes fadeInUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }`;
    document.head.appendChild(style);
  </script>
</body>

</html>
