<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>COGNISKY - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #FFF7ED;
      color: #2F3E46;
      font-family: sans-serif;
      overflow: hidden;
      height: 100vh;
      margin: 0;
    }

    .soft-card {
      background: #FDEDDC;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(47, 62, 70, 0.05);
      padding: 3rem;
      max-width: 450px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .btn-primary {
      background-color: #84A98C;
      color: white;
      font-weight: 600;
      padding: 0.875rem 1.5rem;
      border-radius: 16px;
      transition: background-color 0.3s ease;
      cursor: pointer;
      border: none;
      width: 100%;
    }

    .btn-primary:hover {
      background-color: #63856a;
    }

    .input-field {
      background-color: #FFF7ED;
      color: #2F3E46;
      border-radius: 16px;
      border: 1px solid rgba(47, 62, 70, 0.1);
      box-shadow: inset 0 2px 4px rgba(47, 62, 70, 0.02);
      transition: border-color 0.3s ease;
    }

    .input-field:focus {
      outline: none;
      border-color: #84A98C;
      box-shadow: 0 0 0 2px rgba(132, 169, 140, 0.2);
    }

    .input-field::placeholder {
      color: rgba(47, 62, 70, 0.4);
    }
  </style>
</head>

<body class="flex justify-center items-center">
  <div class="soft-card animate-[fadeInUp_0.8s_ease-out]">
    <h1 class="text-3xl font-bold text-[#84A98C] mb-6">Welcome Back</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div
      class="mb-4 px-4 py-2 rounded-xl text-sm font-medium
            {% if category == 'danger' %} bg-[#fde8e8] text-[#9b1c1c] {% else %} bg-[#def7ec] text-[#03543f] {% endif %}">
      {{ message }}
    </div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <form method="POST" action="/login" class="space-y-4">
      <div>
        <input type="text" name="username" placeholder="Username" required class="w-full px-4 py-3 input-field">
      </div>
      <div>
        <input type="password" name="password" placeholder="Password" required class="w-full px-4 py-3 input-field">
      </div>
      <button type="submit" class="btn-primary mt-2">
        Login
      </button>
    </form>
    <p class="mt-6 text-sm opacity-80 text-[#2F3E46]">Don't have an account? <a href="/register"
        class="text-[#84A98C] font-semibold hover:underline">Register</a></p>
  </div>

  <script>
    const style = document.createElement('style');
    style.innerHTML = `@keyframes fadeInUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }`;
    document.head.appendChild(style);
  </script>
</body>

</html>
